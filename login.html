<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/static/team-x-cemetery.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Team X Cemetery — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--blue:#168cff;--blue2:#0074ff;--line:#2b6ab4;--ink:#020d22;--text:#f1f7ff;--muted:#a9c9f5;--soft:#78b5ff;--danger:#ff7895;--ok:#65f3c7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#01091a;color:var(--text)}
body{font-family:'Tajawal','Inter',sans-serif;min-height:100svh;overflow-x:hidden;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:0 18px 24px}
body:before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,5,18,.08),rgba(0,8,24,.16) 35%,rgba(0,5,18,.78) 100%),url('/static/login-hero.png') center top/cover no-repeat;filter:saturate(1.14) contrast(1.06)}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 26%,transparent 20%,rgba(0,3,15,.2) 58%,rgba(0,2,12,.78) 100%)}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35}
.login-wrap{position:relative;z-index:2;width:min(100%,790px);padding-top:35.5svh;animation:rise .65s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.auth-shell{position:relative;padding:2px;background:linear-gradient(115deg,#158dff,#0c5bde 48%,#1e9dff);clip-path:polygon(3.3% 0,96.7% 0,100% 3.3%,100% 96.7%,96.7% 100%,3.3% 100%,0 96.7%,0 3.3%);box-shadow:0 0 20px rgba(0,126,255,.95),0 0 70px rgba(0,79,255,.5),0 25px 85px rgba(0,0,0,.8)}
.auth-shell:before{content:"";position:absolute;inset:-8px;z-index:-1;clip-path:polygon(3.3% 0,96.7% 0,100% 3.3%,100% 96.7%,96.7% 100%,3.3% 100%,0 96.7%,0 3.3%);border:1px solid rgba(23,156,255,.7);filter:drop-shadow(0 0 8px #087fff)}
.card{background:linear-gradient(165deg,rgba(1,15,43,.965),rgba(1,8,27,.975));padding:40px 55px 27px;min-height:700px;text-align:center;clip-path:polygon(3.3% 0,96.7% 0,100% 3.3%,100% 96.7%,96.7% 100%,3.3% 100%,0 96.7%,0 3.3%);box-shadow:inset 0 0 42px rgba(16,106,255,.12)}
.card-head{margin-bottom:25px}.crown{font-size:1.25rem;color:#dbeeff;text-shadow:0 0 13px #299cff;margin-bottom:4px}.card h1{font-size:2rem;font-weight:800;line-height:1.3;text-shadow:0 0 18px rgba(72,164,255,.65);margin-bottom:4px}.card-head p{font-size:1rem;line-height:1.9;color:#a7c9f5}.card-head p strong{display:block;color:#0ea6ff;font-size:1.2rem;font-weight:800}
.form-section{display:none;text-align:right}.form-section.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.alert{display:none;align-items:center;gap:8px;padding:10px 13px;margin-bottom:13px;border-radius:10px;font-size:.82rem}.alert.show{display:flex}.alert.error{background:rgba(255,43,88,.13);border:1px solid rgba(255,102,133,.55);color:#ffc0cd}.alert.success{background:rgba(44,221,170,.12);border:1px solid rgba(101,243,199,.5);color:#a4ffe7}
.field{margin-bottom:18px}.field label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.input-wrap{position:relative}.inp{width:100%;height:72px;border:2px solid #2e64aa;border-radius:16px;background:rgba(2,15,42,.83);color:#fff;outline:none;padding:0 62px 0 64px;font:500 1.12rem 'Tajawal';text-align:right;box-shadow:inset 0 0 18px rgba(0,64,161,.18),0 0 9px rgba(4,117,255,.18);transition:.2s}.inp:focus{border-color:#36a2ff;box-shadow:0 0 0 3px rgba(32,144,255,.16),0 0 22px rgba(0,126,255,.5)}.inp::placeholder{color:#8eadde}.inp-icon{position:absolute;right:26px;top:50%;transform:translateY(-50%);color:#62aeff;font-size:1.7rem;pointer-events:none}.eye-btn{position:absolute;left:21px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#7fc0ff;font-size:1.35rem;padding:9px;cursor:pointer}
.form-options{display:flex;justify-content:space-between;align-items:center;margin:3px 7px 20px;color:#d7eaff;font-size:1rem}.remember-option{display:flex;align-items:center;gap:9px;cursor:pointer}.remember-option input{appearance:none;width:27px;height:27px;border-radius:6px;border:1px solid #247ff0;background:#0d77e8;position:relative}.remember-option input:checked:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:1.25rem;font-weight:800}.form-options a{color:#168cff;text-decoration:none}.form-options a:hover{text-decoration:underline}
.submit{width:100%;height:72px;border:1px solid #42caff;border-radius:16px;color:#fff;background:linear-gradient(105deg,#087dff,#0061e9 50%,#128bff);box-shadow:0 0 22px rgba(0,138,255,.9),inset 0 0 17px rgba(255,255,255,.14);font:800 1.35rem 'Tajawal';cursor:pointer;transition:.2s}.submit:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 0 35px rgba(24,163,255,.9)}.submit:disabled{opacity:.65;cursor:not-allowed}.submit i{margin-right:8px}.spin{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:30px;color:#c5dcfb;font-size:1.08rem;margin:27px 0 20px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#4b79b1}.register-toggle{width:100%;height:63px;border:2px solid #147dff;border-radius:16px;background:rgba(2,18,49,.65);color:#e7f3ff;font:700 1.15rem 'Tajawal';cursor:pointer;box-shadow:0 0 12px rgba(0,110,255,.25);transition:.2s}.register-toggle:hover{background:rgba(7,55,125,.68);box-shadow:0 0 23px rgba(0,126,255,.62)}.register-toggle i{margin-right:9px;color:#b6d8ff}.free-plan{background:rgba(9,67,151,.2);border:1px solid rgba(88,187,255,.35);border-radius:12px;padding:12px;text-align:center;margin-bottom:15px}.free-plan h4{font-size:.82rem;color:#83d9ff;margin-bottom:8px}.free-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.chip{font-size:.7rem;color:#bddbff;background:rgba(255,255,255,.06);border-radius:99px;padding:4px 9px}.back-login{border:0;background:none;color:#68b6ff;font:600 .95rem 'Tajawal';cursor:pointer;margin-top:15px;width:100%}
.features{display:flex;justify-content:space-around;align-items:flex-start;gap:20px;margin-top:35px;padding-top:24px;border-top:1px solid rgba(37,115,210,.55)}.feature{flex:1;color:#d5e8ff;font-family:'Inter','Tajawal',sans-serif;font-size:.9rem}.feature i{display:block;color:#138dff;font-size:2rem;margin-bottom:12px;text-shadow:0 0 13px #007dff}.feature:not(:last-child){border-left:1px solid rgba(42,126,228,.65)}.auth-footer{text-align:center;color:#9dbbe5;font-size:.82rem;margin:20px 0 0;line-height:1.8}.auth-footer a{color:#70baff;text-decoration:none}.watermark{text-align:center;color:#91c4ff;font-size:.88rem;margin-top:12px}.watermark i{color:#188dff;margin:0 9px;text-shadow:0 0 10px #168cff}.footer-brand{font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:650px){body{padding:0 11px 18px}.login-wrap{width:100%;padding-top:31svh}.card{padding:28px 20px 21px;min-height:0}.card h1{font-size:1.55rem}.card-head p{font-size:.85rem}.card-head p strong{font-size:1rem}.inp{height:58px;font-size:.96rem;padding-right:52px;padding-left:52px;border-radius:12px}.inp-icon{right:18px;font-size:1.35rem}.eye-btn{left:12px;font-size:1.08rem}.form-options{font-size:.79rem;margin-bottom:16px}.remember-option input{width:23px;height:23px}.submit{height:61px;font-size:1.12rem;border-radius:13px}.divider{font-size:.9rem;gap:18px;margin:22px 0 15px}.register-toggle{height:53px;font-size:.94rem;border-radius:13px}.features{gap:8px;margin-top:25px;padding-top:18px}.feature{font-size:.69rem}.feature i{font-size:1.45rem;margin-bottom:7px}.auth-footer{font-size:.68rem}.watermark{font-size:.68rem}.auth-shell:before{inset:-5px}}
@media(max-width:380px){.login-wrap{padding-top:28svh}.card{padding-left:14px;padding-right:14px}.card h1{font-size:1.38rem}.features{gap:2px}.feature{font-size:.62rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="login-wrap">
  <div class="auth-shell"><main class="card">
    <div class="card-head"><div class="crown"><i class="fas fa-crown"></i></div><h1>مرحبًا بك في منصة</h1><p><strong>Team X Cemetery</strong>أدر بوتاتك ومشاريعك من مكان واحد</p></div>
    <section class="form-section active" id="loginForm" aria-label="تسجيل الدخول">
      <div class="alert error" id="loginError"><i class="fas fa-circle-xmark"></i><span id="loginErrMsg"></span></div><div class="alert success" id="loginSuccess"><i class="fas fa-circle-check"></i><span id="loginOkMsg"></span></div>
      <div class="field"><label for="loginEmail">اسم المستخدم أو البريد الإلكتروني</label><div class="input-wrap"><input class="inp" id="loginEmail" type="email" placeholder="اسم المستخدم أو البريد الإلكتروني" autocomplete="email"><i class="fas fa-user inp-icon"></i></div></div>
      <div class="field"><label for="loginPass">كلمة المرور</label><div class="input-wrap"><input class="inp" id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password"><i class="fas fa-lock inp-icon"></i><button class="eye-btn" type="button" onclick="togglePass('loginPass',this)" aria-label="إظهار كلمة المرور"><i class="fas fa-eye-slash"></i></button></div></div>
      <div class="form-options"><label class="remember-option"><input id="rememberMe" type="checkbox"> تذكرني</label><a href="#" onclick="showAlert('loginError','إذا نسيت كلمة المرور، تواصل مع إدارة المنصة');return false"><i class="fas fa-lock"></i> نسيت كلمة المرور؟</a></div>
      <button class="submit" id="loginBtn" onclick="doLogin()"><span class="spin" id="loginSpin"></span><i class="fas fa-arrow-left" id="loginIcon"></i><span id="loginBtnTxt">تسجيل الدخول</span></button>
    </section>
    <section class="form-section" id="registerForm" aria-label="إنشاء حساب"><div class="free-plan"><h4><i class="fas fa-gift"></i> الخطة المجانية — مجاناً للأبد</h4><div class="free-chips"><span class="chip"><i class="fas fa-server"></i> 5 سيرفرات</span><span class="chip"><i class="fas fa-database"></i> 100 GB</span><span class="chip"><i class="fas fa-microchip"></i> 512 MB RAM</span></div></div><div class="alert error" id="regError"><i class="fas fa-circle-xmark"></i><span id="regErrMsg"></span></div><div class="alert success" id="regSuccess"><i class="fas fa-circle-check"></i><span id="regOkMsg"></span></div><div class="field"><label for="regEmail">البريد الإلكتروني</label><div class="input-wrap"><input class="inp" id="regEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><i class="fas fa-envelope inp-icon"></i></div></div><div class="field"><label for="regPass">كلمة المرور</label><div class="input-wrap"><input class="inp" id="regPass" type="password" placeholder="8 أحرف وحرف ورقم" autocomplete="new-password"><i class="fas fa-lock inp-icon"></i><button class="eye-btn" type="button" onclick="togglePass('regPass',this)" aria-label="إظهار كلمة المرور"><i class="fas fa-eye-slash"></i></button></div></div><button class="submit" id="regBtn" onclick="doRegister()"><span class="spin" id="regSpin"></span><i class="fas fa-user-plus" id="regIcon"></i><span id="regBtnTxt">إنشاء الحساب</span></button><button type="button" class="back-login" onclick="switchTab('login')"><i class="fas fa-arrow-right"></i> العودة إلى تسجيل الدخول</button></section>
    <div id="loginExtras"><div class="divider">أو</div><button type="button" class="register-toggle" onclick="switchTab('register')"><i class="fas fa-user-plus"></i> إنشاء حساب جديد</button></div>
    <div class="features"><div class="feature"><i class="fas fa-bolt"></i><span>Fast Deploy</span></div><div class="feature"><i class="fas fa-cloud-arrow-up"></i><span>99.9% Uptime</span></div><div class="feature"><i class="fas fa-server"></i><span>Multi Runtime</span></div></div>
  </main></div>
  <p class="auth-footer">بالاستمرار، أنت توافق على <a href="#">شروط الخدمة</a> و<a href="#">سياسة الخصوصية</a></p><div class="watermark">© 2026 Team X Cemetery<br><span>جميع الحقوق محفوظة</span><br><i class="fas fa-crown"></i></div>
</div>
<script>
(()=>{const nativeFetch=window.fetch.bind(window);window.fetch=async(input,init={})=>{const url=typeof input==='string'?input:input.url;const method=(init.method||'GET').toUpperCase();if(url.startsWith('/api/')&&!['GET','HEAD','OPTIONS'].includes(method)&&!url.endsWith('/csrf')){const cr=await nativeFetch('/api/csrf');const cd=await cr.json();init.headers=new Headers(init.headers||{});init.headers.set('X-CSRF-Token',cd.token)}return nativeFetch(input,init)}})();
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,pts=[];function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight}function mkPt(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()+.4,a:Math.random()*.18+.05}}function seed(){pts=[];for(let i=0;i<(innerWidth<600?28:60);i++)pts.push(mkPt())}addEventListener('resize',()=>{rsz();seed()});rsz();seed();(function loop(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(92,190,255,${p.a})`;ctx.fill()});requestAnimationFrame(loop)})();
function switchTab(t){document.getElementById('loginForm').classList.toggle('active',t==='login');document.getElementById('registerForm').classList.toggle('active',t==='register');document.getElementById('loginExtras').style.display=t==='login'?'block':'none';hideAlerts();window.scrollTo({top:0,behavior:'smooth'})}
function togglePass(id,btn){const inp=document.getElementById(id);inp.type=inp.type==='password'?'text':'password';btn.querySelector('i').className='fas '+(inp.type==='text'?'fa-eye':'fa-eye-slash')}
function setLoading(btnId,spinId,iconId,on){document.getElementById(btnId).disabled=on;document.getElementById(spinId).style.display=on?'block':'none';document.getElementById(iconId).style.display=on?'none':'inline'}
function showAlert(id,msg){const el=document.getElementById(id);const txt=el.querySelector('span');if(txt)txt.textContent=msg;el.classList.add('show')}
function hideAlerts(){['loginError','loginSuccess','regError','regSuccess'].forEach(id=>document.getElementById(id).classList.remove('show'))}
let authBusy=false;
async function doLogin(){if(authBusy)return;const email=document.getElementById('loginEmail').value.trim(),pass=document.getElementById('loginPass').value;if(!email||!pass){showAlert('loginError','الرجاء إدخال البريد الإلكتروني وكلمة المرور');return}authBusy=true;if(document.getElementById('rememberMe').checked)localStorage.setItem('host_login_email',email);else localStorage.removeItem('host_login_email');setLoading('loginBtn','loginSpin','loginIcon',true);document.getElementById('loginBtnTxt').textContent='جاري الدخول...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}),d=await r.json();if(d.success){showAlert('loginSuccess','تم تسجيل الدخول، جاري التوجيه...');setTimeout(()=>location.href=d.redirect||'/dashboard',500)}else{authBusy=false;showAlert('loginError',d.message||'بيانات الدخول غير صحيحة');setLoading('loginBtn','loginSpin','loginIcon',false);document.getElementById('loginBtnTxt').textContent='تسجيل الدخول'}}catch(e){authBusy=false;showAlert('loginError','تعذر الاتصال بالخادم');setLoading('loginBtn','loginSpin','loginIcon',false);document.getElementById('loginBtnTxt').textContent='تسجيل الدخول'}}
async function doRegister(){if(authBusy)return;const email=document.getElementById('regEmail').value.trim(),pass=document.getElementById('regPass').value;if(!email||!pass){showAlert('regError','الرجاء إدخال جميع البيانات');return}if(!email.includes('@')){showAlert('regError','البريد الإلكتروني غير صالح');return}if(pass.length<8||!/[A-Za-z]/.test(pass)||!/\d/.test(pass)){showAlert('regError','كلمة المرور يجب أن تكون 8 أحرف وتحتوي حرفًا ورقمًا');return}authBusy=true;setLoading('regBtn','regSpin','regIcon',true);document.getElementById('regBtnTxt').textContent='جاري الإنشاء...';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}),d=await r.json();if(d.success){authBusy=false;showAlert('regSuccess',d.message||'تم إنشاء الحساب بنجاح');setTimeout(()=>switchTab('login'),1200)}else{authBusy=false;showAlert('regError',d.message||'فشل إنشاء الحساب')}setLoading('regBtn','regSpin','regIcon',false);document.getElementById('regBtnTxt').textContent='إنشاء الحساب'}catch(e){authBusy=false;showAlert('regError','تعذر الاتصال بالخادم');setLoading('regBtn','regSpin','regIcon',false);document.getElementById('regBtnTxt').textContent='إنشاء الحساب'}}
document.getElementById('loginBtn').addEventListener('click',doLogin);const rememberedEmail=localStorage.getItem('host_login_email');if(rememberedEmail){document.getElementById('loginEmail').value=rememberedEmail;document.getElementById('rememberMe').checked=true}document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(document.getElementById('loginForm').classList.contains('active'))doLogin();else doRegister()}});
</script>
</body>
</html>
